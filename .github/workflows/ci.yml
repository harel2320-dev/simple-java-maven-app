name: CI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Increase the patch version
        run: |
          OLD=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          MAJOR=$(echo $OLD | cut -d. -f1)
          MINOR=$(echo $OLD | cut -d. -f2)
          PATCH=$(echo $OLD | cut -d. -f3)
          PATCH=$((PATCH + 1))
          NEW=$MAJOR.$MINOR.$PATCH
          mvn versions:set -DnewVersion=$NEW -DgenerateBackupPoms=false
          echo "VERSION=$NEW" >> $GITHUB_ENV

      - name: Login to Docker Hub
        run: echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login -u ${{ vars.DOCKERHUB_USERNAME }} --password-stdin

      - name: Build the image
        run: docker build -t ${{ vars.DOCKERHUB_USERNAME }}/simple-java-maven-app:$VERSION .

      - name: Push the image
        run: docker push ${{ vars.DOCKERHUB_USERNAME }}/simple-java-maven-app:$VERSION

      - name: Run the image
        run: docker run --rm ${{ vars.DOCKERHUB_USERNAME }}/simple-java-maven-app:$VERSION

      - name: Save the new version
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git commit -am "new version $VERSION"
          git push